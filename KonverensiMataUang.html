<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Javascript Project - Konversi Mata Uang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; }
    html { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-stone-50 to-stone-100 text-stone-800">
  
  <nav class="bg-white border-b border-stone-200">
    <div class="max-w-4xl mx-auto px-6 py-3 flex items-center justify-between">
      <h1 class="text-base font-bold text-stone-700 tracking-wide pl-0">Javascript Project</h1>
      <a href="index.html" class="text-xs font-semibold text-[#4B5320] hover:underline pr-0">← Kembali ke Portofolio</a>
    </div>
  </nav>

  <header class="p-6">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-stone-800">Konversi Mata Uang</h1>
     </div>
  </header>

  <main class="px-6 pb-16">
    <div class="max-w-4xl mx-auto grid md:grid-cols-3 gap-6">
      
      <section class="md:col-span-1 bg-white rounded-2xl shadow-sm p-5 border border-stone-200">
        <h2 class="font-semibold text-lg text-stone-800">1) Pilih Kategori</h2>
        <label for="kategori" class="sr-only">Kategori</label>
        <select id="kategori" class="mt-3 w-full rounded-xl border border-stone-300 bg-white text-stone-800 focus:border-[#4B5320] focus:ring-[#4B5320] p-2.5">
          <option value="fiat">Mata Uang Negara (Fiat)</option>
          <option value="kripto">Mata Uang Kripto</option>
        </select>

        <div class="mt-6">
          <label for="satuanTujuan" class="block text-sm font-medium text-stone-700">Target Konversi</label>
          <select id="satuanTujuan" class="mt-2 w-full rounded-xl border border-stone-300 bg-white text-stone-800 focus:border-[#4B5320] focus:ring-[#4B5320] p-2.5">
          </select>
          <p class="mt-1 text-xs text-stone-500">Hasil akan otomatis diubah ke satuan target ini.</p>
        </div>
      </section>

      <section class="md:col-span-2 bg-white rounded-2xl shadow-sm p-5 border border-stone-200">
        <h2 class="font-semibold text-lg text-stone-800">2) Masukkan Nilai</h2>
        <div id="paramForm" class="mt-4 grid sm:grid-cols-2 gap-4">
        </div>

        <div class="mt-6 flex flex-wrap gap-3">
          <button id="hitungBtn" class="px-5 py-2.5 rounded-xl bg-[#008000] text-white font-semibold shadow hover:bg-green-700 active:scale-[.98] transition-all">Konversi</button>
          <button id="resetBtn" type="button" class="px-5 py-2.5 rounded-xl bg-stone-100 text-stone-700 font-semibold border border-stone-200 hover:bg-stone-200 transition-all">Reset</button>
        </div>

        <div id="notif" class="hidden mt-4 text-sm"></div>
      </section>

      <section class="md:col-span-3 bg-white rounded-2xl shadow-sm p-5 border border-stone-200">
        <h2 class="font-semibold text-lg text-stone-800">3) Formula & Hasil</h2>
        <div class="mt-3 grid md:grid-cols-2 gap-4">
          <div class="rounded-xl border border-stone-200 p-4 bg-stone-50">
            <h3 class="font-semibold text-stone-700">Panduan & Rumus</h3>
            <p id="rumusText" class="mt-2 text-sm text-stone-600">—</p>
            <ul id="catatan" class="mt-3 text-xs text-stone-500 list-disc list-inside space-y-1"></ul>
          </div>
          <div class="rounded-xl border border-stone-200 p-4 bg-stone-50">
            <h3 class="font-semibold text-stone-700">Hasil Konversi</h3>
            <p id="hasilText" class="mt-2 text-2xl font-bold text-[#4B5320]">—</p>
            <p id="detailText" class="mt-1 text-sm text-stone-600">Masukkan nilai parameter lalu klik <em>Konversi</em>.</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer class="px-6 pb-10">
    <div class="max-w-4xl mx-auto text-xs text-stone-500 text-center">© create by Dama 2026 </div>
  </footer>

  <script>
    const CONVERSIONS = {
      fiat: {
        name: 'Konversi Mata Uang',
        units: { 
          IDR: 'Rupiah (IDR)', 
          USD: 'US Dollar (USD)', 
          JPY: 'Yen Jepang (JPY)', 
          EUR: 'Euro (EUR)', 
          GBP: 'Poundsterling (GBP)',
          SGD: 'Dolar Singapura (SGD)',
          MYR: 'Ringgit Malaysia (MYR)',
          KRW: 'Won Korea (KRW)',
          CNY: 'Yuan Tiongkok (CNY)',
          AUD: 'Dolar Australia (AUD)',
          THB: 'Baht Thailand (THB)',
          SAR: 'Riyal Arab Saudi (SAR)',
          AED: 'Dirham UEA (AED)',
          CAD: 'Dolar Kanada (CAD)'
        },
        multipliers: { 
          IDR: 1, 
          USD: 17782, 
          JPY: 104, 
          EUR: 16800, 
          GBP: 19600, 
          SGD: 11600, 
          MYR: 3250, 
          KRW: 11.5, 
          CNY: 2150, 
          AUD: 10200, 
          THB: 430, 
          SAR: 4130, 
          AED: 4220, 
          CAD: 11450 
        },
        fields: [
          { key: 'nilai', label: 'Nominal Uang', placeholder: 'contoh: 150000' },
          { key: 'asal', label: 'Dari Mata Uang', type: 'select', options: { 
            IDR: 'Rupiah (IDR)', 
            USD: 'US Dollar (USD)', 
            JPY: 'Yen Jepang (JPY)', 
            EUR: 'Euro (EUR)', 
            GBP: 'Poundsterling (GBP)',
            SGD: 'Dolar Singapura (SGD)',
            MYR: 'Ringgit Malaysia (MYR)',
            KRW: 'Won Korea (KRW)',
            CNY: 'Yuan Tiongkok (CNY)',
            AUD: 'Dolar Australia (AUD)',
            THB: 'Baht Thailand (THB)',
            SAR: 'Riyal Arab Saudi (SAR)',
            AED: 'Dirham UEA (AED)',
            CAD: 'Dolar Kanada (CAD)'
          } }
        ],
        formulaText: 'Menggunakan standar basis Rupiah (IDR) untuk menghitung perbandingan nilai tukar secara akurat.',
        notes: [
          'Mendukung konversi bolak-balik (misal: IDR ke JPY, atau JPY ke IDR).',
          'Nilai tukar menggunakan perkiraan rata-rata konversi statis.',
          'Pastikan mengisi angka positif tanpa titik atau koma ribuan.'
        ]
      },
      kripto: {
        name: 'Konversi Kripto',
        units: { 
          BTC: 'Bitcoin (BTC)', 
          ETH: 'Ethereum (ETH)', 
          SOL: 'Solana (SOL)', 
          USDT: 'Tether (USDT)',
          IDR: 'Rupiah (IDR)',
          USD: 'US Dollar (USD)'
        },
        multipliers: { 
          BTC: 1000000000, 
          ETH: 50000000, 
          SOL: 2500000, 
          USDT: 17782,
          IDR: 1,
          USD: 17782
        },
        fields: [
          { key: 'nilai', label: 'Nominal', placeholder: 'contoh: 0.5' },
          { key: 'asal', label: 'Dari Mata Uang', type: 'select', options: { 
            BTC: 'Bitcoin (BTC)', 
            ETH: 'Ethereum (ETH)', 
            SOL: 'Solana (SOL)', 
            USDT: 'Tether (USDT)',
            IDR: 'Rupiah (IDR)',
            USD: 'US Dollar (USD)'
          } }
        ],
        formulaText: 'Menggunakan standar basis Rupiah (IDR) untuk menghitung perbandingan aset digital.',
        notes: [
          'Bisa menghitung dari Fiat ke Kripto atau sebaliknya.',
          'Nilai menggunakan estimasi statis.',
          'Gunakan titik (.) untuk desimal.'
        ]
      }
    };

    function numberOrNaN(value) {
      const n = parseFloat(String(value).replace(',', '.'));
      return isNaN(n) ? NaN : n;
    }

    function renderFields(kategoriKey) {
      const cfg = CONVERSIONS[kategoriKey];
      const $form = $('#paramForm').empty();
      const $targetSelect = $('#satuanTujuan').empty();

      Object.entries(cfg.units).forEach(([k, v]) => {
        $targetSelect.append(`<option value="${k}">${v}</option>`);
      });

      cfg.fields.forEach(f => {
        const fieldId = `field_${f.key}`;
        if (f.type === 'select') {
          let optionsHtml = '';
          Object.entries(f.options).forEach(([k, v]) => {
            optionsHtml += `<option value="${k}">${v}</option>`;
          });
          $form.append(`
            <div class="space-y-2">
              <label for="${fieldId}" class="block text-sm font-medium text-stone-700">${f.label}</label>
              <select id="${fieldId}" name="${f.key}" class="w-full rounded-xl border border-stone-300 bg-white text-stone-800 focus:border-[#4B5320] focus:ring-[#4B5320] p-2.5">${optionsHtml}</select>
            </div>
          `);
        } else {
          $form.append(`
            <div class="space-y-2">
              <label for="${fieldId}" class="block text-sm font-medium text-stone-700">${f.label}</label>
              <input id="${fieldId}" name="${f.key}" type="number" step="any" inputmode="decimal" placeholder="${f.placeholder}" class="w-full rounded-xl border border-stone-300 bg-white text-stone-800 focus:border-[#4B5320] focus:ring-[#4B5320] p-2.5" />
            </div>
          `);
        }
      });

      $('#rumusText').text(cfg.formulaText);
      const $notes = $('#catatan').empty();
      cfg.notes.forEach(n => $notes.append(`<li>${n}</li>`));

      $('#hasilText').text('—');
      $('#detailText').text('Isi parameter lalu klik Konversi.');
      $('#notif').addClass('hidden').removeClass('text-red-700 bg-red-50 border-red-200').text('');
    }

    function showError(msg) {
      $('#notif').removeClass('hidden').addClass('mt-4 text-sm border rounded-lg p-3 bg-red-50 text-red-700 border-red-200').text(msg);
    }

    $(function () {
      renderFields($('#kategori').val());

      $('#kategori').on('change', function () {
        renderFields(this.value);
      });

      $('#resetBtn').on('click', function () {
        renderFields($('#kategori').val());
        $('#paramForm').find('input').val('');
      });

      $('#hitungBtn').on('click', function (e) {
        e.preventDefault();
        const katKey = $('#kategori').val();
        const cfg = CONVERSIONS[katKey];
        
        const nilai = numberOrNaN($('[name=nilai]').val());
        const asal = $('[name=asal]').val();
        const tujuan = $('#satuanTujuan').val();

        if (!isFinite(nilai) || nilai <= 0) {
          showError('Masukkan nilai angka positif yang valid.');
          $('#hasilText').text('—');
          $('#detailText').text('Periksa kembali input Anda.');
          return;
        }

        try {
          const nilaiInBase = nilai * cfg.multipliers[asal];
          const hasilAkhir = nilaiInBase / cfg.multipliers[tujuan];

          const pretty = hasilAkhir.toLocaleString('id-ID', { maximumFractionDigits: 6 }) + ` ${tujuan}`;
          $('#hasilText').text(pretty);
          $('#detailText').text(`Hasil: ${nilai} ${asal} setara dengan ${pretty}`);
          $('#notif').addClass('hidden').text('');
        } catch (err) {
          showError('Terjadi kesalahan saat menghitung.');
        }
      });
    });
  </script>
</body>
</html>
